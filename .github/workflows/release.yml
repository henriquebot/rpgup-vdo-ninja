name: Validate and publish Foundry prototype

on:
  push:
    branches: [main]
    paths:
      - module.json
      - package.json
      - src/**
      - styles/**
      - scripts/**
      - tests/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: foundry-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm test
      - run: npm run check
      - run: npm run package
      - name: Package module with manifest at archive root
        working-directory: dist/rpgup-vdo-ninja
        run: zip -r ../rpgup-vdo-ninja.zip .
      - name: Publish prototype prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p 'JSON.parse(require("fs").readFileSync("module.json", "utf8")).version')
          gh release create "$VERSION" \
            dist/rpgup-vdo-ninja.zip module.json \
            --target "$GITHUB_SHA" \
            --title "RPGUP VDO.Ninja $VERSION" \
            --prerelease \
            --notes-file docs/RELEASE-NOTES.md
